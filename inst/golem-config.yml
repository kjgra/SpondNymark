default:
  golem_name: SpondNymark
  golem_version: 0.0.0.9000
  app_prod: no
  # Spond-roller (navn, uten hensyn til store/små bokstaver) som gir tilgang til appen.
  # Rollenavnene settes av klubben i Spond, så juster listen ved behov.
  access_role_names:
    - Teamleder
    - Trener
    - Lagleder
    - Hovedlagleder
  # Spond-roller som gjør et medlem til trener: vist for seg, uten tagger, og ikke
  # fordelt i gruppeforslag for arrangementer. Uavhengig av tilgangslisten over.
  coach_role_names:
    - Teamleder
    - Trener
    - Lagleder
    - Hovedlagleder
    - Hjelpetrener
    - Keepertrener
    - Hjelper
  # Nøytrale tagger som tilbys med ett trykk (posisjon og rolle). Aldri helseopplysninger.
  tag_suggestions:
    - Keeper
    - Kaptein
    - Forsvar
    - Midtbane
    - Angrep
    - Ny

production:
  app_prod: yes

# Posit Connect setter R_CONFIG_ACTIVE=rsconnect. Denne seksjonen arver alt fra default.
# Hemmeligheter skal ikke stå her, men som miljøvariabler (se .Renviron.example).
rsconnect:
  app_prod: yes

dev:
  golem_wd: !expr golem::pkg_path()

